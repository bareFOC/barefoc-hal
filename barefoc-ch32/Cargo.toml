[package]
name = "barefoc-ch32"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Official CH32 (WCH RISC-V) hardware abstraction bridges for barefoc, built on ch32-hal."

[dependencies]
barefoc = { path = "../../barefoc", default-features = false }
# Portable BareBoot client core (bus triggers + cross-reset mailbox cookie).
barefoc-boot = { path = "../../drivers/barefoc-boot", optional = true }
embedded-hal = { workspace = true }
libm = { workspace = true }

# Optional: Embassy time for the Clock bridge. Enable together with a
# ch32-hal time driver (e.g. ch32-hal/time-driver-tim1).
embassy-time = { version = "0.5", optional = true }

# Optional: WCH CH32 HAL. Enable this (and a chip feature on your direct
# ch32-hal dependency) to get the hardware bridges.
ch32-hal = { path = "../../ref/ch32-hal", optional = true, default-features = false }

[features]
default = []
# BareBoot handsfree entry (RISC-V CSR disable + PFIC reset). Default off.
bareboot = ["dep:barefoc-boot"]
ch32-hal = ["dep:ch32-hal"]
embassy-time = ["dep:embassy-time"]
adc-v3 = []
adc-v1 = []
ch32v307 = ["ch32-hal", "ch32-hal/ch32v307vct6", "ch32-hal/memory-x", "ch32-hal/rt", "ch32-hal/embassy", "embassy-time", "adc-v3"]

# The BareBoot mailbox contract requires volatile MMIO and RISC-V CSR inline
# asm in the optional `bootloader` module. An in-crate `allow` cannot override
# a `forbid` injected from the command line, so declare the lint table locally
# (same approach as `drivers/barefoc-boot`). Unsafe is confined to that module
# and each block carries a SAFETY rationale.
[lints.rust]
unsafe_code = "allow"
